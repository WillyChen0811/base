[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybase"
version = "0.1.0"
description = "零业务依赖的基础模块：RPC 底座、内存盘、AI 客户端、docx 写作、表格读取、SMB、加密、Word→PDF 转换、字幕与音视频、语音识别、词典查询"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WillyChen0811"}]
# 有意留空：`pip install pybase` 本身不拉任何第三方依赖，装哪个模块的能力
# 就装对应的 extra（见下方 optional-dependencies 与 README「安装」一节）。
dependencies = []

[project.urls]
Homepage = "https://github.com/WillyChen0811/base"

[project.optional-dependencies]
docx = [
    "python-docx>=1.0.0",
]
sheets = [
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
]
smb = [
    "smbprotocol>=1.10.0",
    "pysmb>=1.2.9",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]
crypto = [
    "cryptography>=44.0.0",
]
office = [
    "requests>=2.31.0",
]
office-word = [
    "pywin32>=306; sys_platform == 'win32'",
]
rpc-server = [
    "fastapi>=0.100.0",
]
subtitle = [
    "pysubs2>=1.7.0",
]
# asr 的 Apple 后端零 pip 依赖（系统自带 SpeechAnalyzer），只有 mlx 后端要装
asr-mlx = [
    "mlx-audio>=0.5.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# 引用自身 extras（pip >= 21.2），新增 extra 时只要在这里加名字，不会漏抄依赖
all = [
    "pybase[docx,sheets,smb,crypto,office,office-word,rpc-server,subtitle,asr-mlx]",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pybase*"]

[tool.setuptools.package-data]
"pybase.asr" = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
