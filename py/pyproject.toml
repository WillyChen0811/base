[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybase"
version = "0.1.0"
description = "零业务依赖的基础模块：RPC 底座、内存盘、AI 客户端、docx 写作、表格读取、SMB、加密、Word→PDF 转换、字幕与音视频、词典查询"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WillyChen0811"}]
dependencies = [
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "cryptography>=44.0.0",
    "smbprotocol>=1.10.0",
    "pysmb>=1.2.9",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/WillyChen0811/base"

[project.optional-dependencies]
rpc-server = [
    "fastapi>=0.100.0",
]
subtitle = [
    "pysubs2>=1.7.0",
]
office-word = [
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pybase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
